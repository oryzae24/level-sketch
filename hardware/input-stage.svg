<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" width="1000" height="508" role="img" aria-labelledby="t d">
<title id="t">Level Sketch・測定部の回路</title><desc id="d">モノラル入力とTHRUは直結。100 kΩと100 nFを通して測定枝に分岐し、10 MΩで中点にバイアスする。MCP6002のB回路が測定波形、A回路が中点をバッファーする。</desc>
<style>text{font:13px 'Yu Gothic',Meiryo,sans-serif;fill:#19382c}.h{font-size:17px;font-weight:700}.p{font:12px Consolas,monospace;fill:#446153}.n{font:700 15px Consolas,monospace;fill:#1f6651}.wire{fill:none;stroke:#245844;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.body{fill:#f5f7ef;stroke:#245844;stroke-width:2}.dot{fill:#245844}.rule{stroke:#c7d1c0}.gnd{fill:none;stroke:#245844;stroke-width:2}</style>
<rect width="1000" height="508" fill="#fafbf5"/><text class="h" x="27" y="30">入力とA0</text>
<text class="n" x="30" y="68">J1 TIP</text><path class="wire" d="M90 63H895"/><text class="n" x="903" y="68">J2 TIP</text><text x="430" y="55">演奏信号は直結</text>
<circle class="dot" cx="106" cy="63" r="4"/><path class="wire" d="M106 63V152H139 M204 152H243 M250 152H430"/>
<rect class="body" x="139" y="146" width="65" height="12"/><text x="139" y="136">R1　100 kΩ</text>
<path class="wire" d="M243 136V167 M250 136V167"/><text x="218" y="125">C1　100 nF</text>
<circle class="dot" cx="315" cy="152" r="4"/><path class="wire" d="M315 152V179 M315 224V249"/>
<rect class="body" x="310" y="179" width="10" height="45"/><text x="328" y="209">R2　10 MΩ</text><text class="n" x="291" y="267">VMID</text>
<path class="body" d="M430 127V217L510 172Z"/><text class="p" x="412" y="149">5</text><text x="435" y="156">+</text><text class="p" x="412" y="199">6</text><text x="435" y="201">−</text><text class="h" x="445" y="119">U1B</text>
<path class="wire" d="M510 172H602 M547 172V233H393V195H430"/><circle class="dot" cx="547" cy="172" r="4"/><text class="p" x="518" y="164">7</text>

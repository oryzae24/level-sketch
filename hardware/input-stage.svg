<text x="214" y="416">+</text><text x="226" y="435">C2　100 µF</text><path class="gnd" d="M193 459H217 M197 464H213 M201 469H209"/>
<path class="body" d="M356 367V451L436 409Z"/><text class="p" x="336" y="386">3</text><text x="361" y="396">+</text><text class="p" x="336" y="432">2</text><text x="361" y="434">−</text><text class="h" x="376" y="355">U1A</text>

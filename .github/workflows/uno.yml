name: Arduino Uno 作例のビルド
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: '1.6.0'
      - name: ボードと表示ライブラリの導入
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit ILI9341@1.6.3"
          arduino-cli lib install "Adafruit GFX Library@1.13.0" "Adafruit BusIO@1.17.4"
      - name: 全作例をコンパイル
        run: |
          for sketch in firmware/LevelSketch/examples/*; do
            arduino-cli compile --fqbn arduino:avr:uno --library firmware/LevelSketch "$sketch"
          done
